<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>증명 작성</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="stylesheet" href="/static/style.css"><style>.proof-statement{margin:0;padding:10px 14px;background:#f8f9ff;border-left:4px solid #6d64e8;font-size:clamp(14px,2.2vw,20px);line-height:1.4;flex:0 0 auto}.canvas-viewport{min-height:0;flex:1;overflow:auto;background:#e8ebf3;border-radius:10px}.canvas-zoom{transform-origin:top left}.proof-shell canvas{display:block;width:100%;height:auto;touch-action:none}.size-control{display:flex;align-items:center;gap:6px;font-size:13px;color:#4b5563}.size-control input{width:90px}.zoom-control{display:flex;align-items:center;gap:5px;font-size:13px;color:#4b5563}.zoom-control input{width:90px}.zoom-label{min-width:42px;text-align:center}.proof-toolbar{gap:6px}.proof-toolbar button{white-space:nowrap}</style></head><body class="fixed-page"><main class="proof-shell"><header class="proof-header"><div><p class="eyebrow">{{ topic.subject }} · {{ topic.title }}</p><h1>증명 작성</h1></div><span class="page-counter">1 / 1</span></header><p class="proof-statement">{{ topic.statement }}</p><form id="proof-form" method="post" action="/proofs"><input type="hidden" name="topic_id" value="{{ topic.id }}"><input type="hidden" name="proof_pages_data" id="proof-pages-data"><div class="canvas-viewport" id="canvas-viewport"><div class="canvas-zoom" id="canvas-zoom"><canvas id="proof-canvas" width="1200" height="720"></canvas></div></div><div class="proof-toolbar"><button type="button" id="eraser" class="secondary">지우개</button><button type="button" id="pen" class="secondary active-tool">펜</button><label class="size-control">지우개 크기 <input id="eraser-size" type="range" min="4" max="80" value="24"><span id="size-label">24</span></label><button type="button" id="clear" class="secondary">페이지 지우기</button><label class="zoom-control">확대 <input id="zoom" type="range" min="75" max="200" value="100"><span class="zoom-label" id="zoom-label">100%</span></label><span class="toolbar-spacer"></span><button type="button" id="previous" class="secondary">← 이전</button><button type="button" id="next" class="secondary">다음 →</button><button type="submit">증명 제출</button></div></form><p class="muted pencil-note">Apple Pencil만 인식합니다. 손가락은 그리기에 사용되지 않습니다.</p></main><script>
const canvas=document.getElementById('proof-canvas'),ctx=canvas.getContext('2d'),pages=[null],counter=document.querySelector('.page-counter'),zoomInput=document.getElementById('zoom'),zoomLabel=document.getElementById('zoom-label'),canvasZoom=document.getElementById('canvas-zoom'),eraserSize=document.getElementById('eraser-size'),sizeLabel=document.getElementById('size-label');let index=0,drawing=false,mode='pen';ctx.lineWidth=4;ctx.lineCap='round';ctx.strokeStyle='#202938';function blank(){ctx.clearRect(0,0,canvas.width,canvas.height);ctx.globalCompositeOperation='source-over'}function save(){pages[index]=canvas.toDataURL('image/png')}function load(){blank();if(pages[index]){const image=new Image();image.onload=()=>ctx.drawImage(image,0,0);image.src=pages[index]}counter.textContent=(index+1)+' / '+pages.length}function applyZoom(){const scale=Number(zoomInput.value)/100;canvasZoom.style.width=(1200*scale)+'px';canvasZoom.style.height=(720*scale)+'px';canvas.style.width=(1200*scale)+'px';canvas.style.height=(720*scale)+'px';zoomLabel.textContent=zoomInput.value+'%'}function point(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*canvas.width/r.width,y:(e.clientY-r.top)*canvas.height/r.height}}canvas.addEventListener('pointerdown',e=>{if(e.pointerType!=='pen')return;drawing=true;canvas.setPointerCapture(e.pointerId);const p=point(e);ctx.globalCompositeOperation=mode==='eraser'?'destination-out':'source-over';ctx.lineWidth=mode==='eraser'?Number(eraserSize.value):4;ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()});canvas.addEventListener('pointermove',e=>{if(!drawing||e.pointerType!=='pen')return;const p=point(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()});['pointerup','pointercancel'].forEach(name=>canvas.addEventListener(name,e=>{if(e.pointerType==='pen'){drawing=false;save()}}));document.getElementById('eraser').onclick=()=>{mode='eraser';document.getElementById('eraser').classList.add('active-tool');document.getElementById('pen').classList.remove('active-tool')};document.getElementById('pen').onclick=()=>{mode='pen';document.getElementById('pen').classList.add('active-tool');document.getElementById('eraser').classList.remove('active-tool')};eraserSize.oninput=()=>{sizeLabel.textContent=eraserSize.value};zoomInput.oninput=applyZoom;document.getElementById('clear').onclick=()=>{blank();save()};document.getElementById('previous').onclick=()=>{if(index>0){save();index--;load()}};document.getElementById('next').onclick=()=>{save();if(index===pages.length-1)pages.push(null);index++;load()};document.getElementById('proof-form').onsubmit=()=>{save();document.getElementById('proof-pages-data').value=JSON.stringify(pages.filter(Boolean));return pages.some(Boolean)};applyZoom();
</script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})"></script></body></html>
