<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{ topic.title }}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="stylesheet" href="/static/style.css"></head><body class="fixed-page"><main class="page-shell"><p class="eyebrow">{{ topic.subject }} · {{ topic.source_reference }}</p><span class="tag">{% if topic.kind == 'theorem' %}THEOREM{% else %}DEFINITION{% endif %}</span><h1>{{ topic.title }}</h1><p class="page-statement">{{ topic.statement }}</p><p class="muted">선수 지식: {{ topic.prerequisites }}</p><nav class="page-actions"><a class="button secondary" href="/dashboard">대시보드</a><a class="button" href="/problem/{{ topic.id }}">문제 1개 보기 →</a></nav></main><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})"></script></body></html>
