<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{{ problem.id }}</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css"><link rel="stylesheet" href="/static/style.css"></head><body class="fixed-page"><main class="page-shell"><p class="eyebrow">{{ topic.subject }} · {{ problem.id }}</p><h1>문제</h1><p class="page-statement">{{ problem.prompt }}</p><p class="muted">배점: {{ problem.max_score }}점</p><nav class="page-actions"><a class="button secondary" href="/topic/{{ topic.id }}">명제 다시 보기</a><a class="button" href="/proof/{{ topic.id }}">증명 작성 →</a></nav></main><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script><script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" onload="renderMathInElement(document.body,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})"></script></body></html>
